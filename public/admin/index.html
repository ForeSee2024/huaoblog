<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>内容管理后台 | Kael's Cyber Nexus Admin</title>
  <!-- 引入 FontAwesome 图标库与 KaTeX 数学公式样式 -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css" />
  <!-- 锁定经过生产验证的 Decap CMS 具体稳定版本 (v3.3.3) -->
  <script src="https://unpkg.com/decap-cms@3.3.3/dist/decap-cms.js"></script>
</head>
<body>
  <script>
    // 注入后台预览面板专有样式，确保编辑器右侧预览与正式前台博文排版一致
    const customPreviewStyles = `
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        color: #e2e8f0;
        background-color: #0b0f19;
        line-height: 1.7;
        padding: 2rem;
      }
      h1, h2, h3, h4 { color: #f8fafc; font-weight: 800; }
      h1 { font-size: 2rem; margin-bottom: 1rem; border-bottom: 1px solid #1e293b; padding-bottom: 0.5rem; }
      h2 { font-size: 1.5rem; margin-top: 1.8rem; margin-bottom: 0.8rem; }
      h3 { font-size: 1.25rem; margin-top: 1.5rem; margin-bottom: 0.6rem; }
      p { margin-bottom: 1.2rem; color: #94a3b8; font-size: 0.95rem; }
      blockquote {
        border-left: 4px solid #38bdf8;
        background: rgba(56, 189, 248, 0.08);
        padding: 0.75rem 1rem;
        border-radius: 0.5rem;
        margin: 1.5rem 0;
        color: #cbd5e1;
        font-style: italic;
      }
      pre {
        background: #030712 !important;
        border: 1px solid #1e293b;
        border-radius: 0.75rem;
        padding: 1rem;
        overflow-x: auto;
        color: #38bdf8;
      }
      code {
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
        font-size: 0.875rem;
      }
      p code {
        background: rgba(56, 189, 248, 0.15);
        color: #38bdf8;
        padding: 0.2rem 0.4rem;
        border-radius: 0.25rem;
      }
      table {
        width: 100%;
        border-collapse: collapse;
        margin: 1.5rem 0;
      }
      th, td {
        border: 1px solid #1e293b;
        padding: 0.6rem 1rem;
        text-align: left;
      }
      th { background: #0e1320; color: #f8fafc; }
      img { max-width: 100%; border-radius: 0.75rem; margin: 1rem 0; }
      .meta-box {
        background: #0e1320;
        border: 1px solid #1e293b;
        border-radius: 0.75rem;
        padding: 1rem;
        margin-bottom: 1.5rem;
      }
      .tag-pill {
        display: inline-block;
        background: rgba(56, 189, 248, 0.12);
        color: #38bdf8;
        padding: 0.2rem 0.6rem;
        border-radius: 9999px;
        font-size: 0.75rem;
        margin-right: 0.5rem;
        font-weight: 700;
      }
    `;
    CMS.registerPreviewStyle(customPreviewStyles, { raw: true });

    // 注册文章组件实时预览模板
    const PostPreview = createClass({
      render: function() {
        const entry = this.props.entry;
        const title = entry.getIn(['data', 'title']) || '无标题文章';
        const category = entry.getIn(['data', 'category']) || '未分类';
        const description = entry.getIn(['data', 'description']) || '';
        const pubDate = entry.getIn(['data', 'pubDate']) || '';
        const body = this.props.widgetFor('body');

        return h('div', {},
          h('div', { className: 'meta-box' },
            h('span', { className: 'tag-pill' }, category),
            h('span', { style: { color: '#64748b', fontSize: '0.85rem' } }, pubDate ? String(pubDate).split('T')[0] : ''),
            h('h1', { style: { marginTop: '0.75rem' } }, title),
            description ? h('blockquote', {}, description) : null
          ),
          h('div', { className: 'post-body' }, body)
        );
      }
    });

    CMS.registerPreviewTemplate('posts', PostPreview);
  </script>
</body>
</html>
