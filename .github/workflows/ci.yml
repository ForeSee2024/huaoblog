name: CI Quality Gate (Astro Check & Build)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  quality-check:
    name: Type Check & Production Build
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js Runtime
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install Project Dependencies
        run: npm ci

      - name: Run Astro Type & Template Check
        run: npm run check

      - name: Verify Content, Preview and OAuth Behavior
        run: npm test

      - name: Build Independent Node Application
        run: npm run test:node

      - name: Build Cloudflare Worker
        run: npm run build:cloudflare
