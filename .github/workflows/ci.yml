name: CI Quality Gate (Astro Check & Build)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  quality-check:
    name: Type Check & Production Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js Runtime
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install Project Dependencies
        run: npm ci

      - name: Run Astro Type & Template Check
        run: npm run check

      - name: Verify Content, Preview and OAuth Behavior
        run: npm test

      - name: Build Independent Node Application
        run: npm run test:node

      - name: Build Cloudflare Worker
        run: npm run build:cloudflare
